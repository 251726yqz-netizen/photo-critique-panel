name: Validate skill package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  structural-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
